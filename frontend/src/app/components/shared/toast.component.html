<div class="fixed top-5 right-5 z-50 space-y-3">
  <div
    *ngFor="let toast of toastService.toasts"
    class="flex items-start gap-3 px-4 py-3 rounded-xl shadow-lg border text-sm w-80 animate-slideIn"
    [ngClass]="{
      'bg-green-50 border-green-200 text-green-800': toast.type === 'success',
      'bg-red-50 border-red-200 text-red-800': toast.type === 'error',
      'bg-blue-50 border-blue-200 text-blue-800': toast.type === 'info'
    }"
  >
    <div class="mt-0.5">
      <span *ngIf="toast.type === 'success'">✅</span>
      <span *ngIf="toast.type === 'error'">❌</span>
      <span *ngIf="toast.type === 'info'">ℹ️</span>
    </div>

    <div class="flex-1">
      <p class="font-semibold">{{ toast.title }}</p>
      <p class="text-xs opacity-80">{{ toast.message }}</p>
    </div>

    <button
      (click)="toastService.remove(toast.id)"
      class="text-xs opacity-60 hover:opacity-100"
    >
      ✕
    </button>
  </div>
</div>
