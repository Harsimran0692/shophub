    <!-- Manual Login Form -->
    <form
      class="mt-8 space-y-6"
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
    >
      <div class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">
            Email address
          </label>
          <input
            id="email"
            name="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            class="input-field mt-1 w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary-500 focus:border-primary-500"
            [class.border-red-500]="
              loginForm.get('email')?.invalid && loginForm.get('email')?.touched
            "
            placeholder="Enter your email"
          />
          <div
            *ngIf="
              loginForm.get('email')?.invalid && loginForm.get('email')?.touched
            "
            class="mt-1 text-sm text-red-600"
          >
            <div *ngIf="loginForm.get('email')?.errors?.['required']">
              Email is required
            </div>
            <div *ngIf="loginForm.get('email')?.errors?.['email']">
              Please enter a valid email
            </div>
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">
            Password
          </label>
          <input
            id="password"
            name="password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            class="input-field mt-1 w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary-500 focus:border-primary-500"
            [class.border-red-500]="
              loginForm.get('password')?.invalid &&
              loginForm.get('password')?.touched
            "
            placeholder="Enter your password"
          />
          <div
            *ngIf="
              loginForm.get('password')?.invalid &&
              loginForm.get('password')?.touched
            "
            class="mt-1 text-sm text-red-600"
          >
            <div *ngIf="loginForm.get('password')?.errors?.['required']">
              Password is required
            </div>
            <div *ngIf="loginForm.get('password')?.errors?.['minlength']">
              Password must be at least 6 characters
            </div>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-between">
        <div class="flex items-center">
          <input
            id="remember-me"
            name="remember-me"
            type="checkbox"
            class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 rounded"
          />
          <label for="remember-me" class="ml-2 block text-sm text-gray-900">
            Remember me
          </label>
        </div>

        <div class="text-sm">
          <a
            routerLink="/forgot-password"
            class="font-medium text-primary-600 hover:text-primary-500"
          >
            Forgot your password?
          </a>
        </div>
      </div>

      <!-- Manual Login Button -->
      <div>
        <button
          type="submit"
          [disabled]="loginForm.invalid || loading"
          class="btn-primary w-full flex justify-center py-3 px-4 rounded-md shadow-sm bg-primary-600 text-white font-medium hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span *ngIf="loading" class="loading-spinner w-5 h-5 mr-2"></span>
          {{ loading ? "Signing in..." : "Sign in" }}
        </button>
      </div>

      <!-- Account Linking Button (for Google 409 errors) -->
      <div *ngIf="error && error.includes('Email already registered')">
        <button
          type="button"
          [disabled]="loginForm.get('password')?.invalid || loading"
          class="btn-primary w-full flex justify-center py-3 px-4 rounded-md shadow-sm bg-primary-600 text-white font-medium hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 disabled:opacity-50 disabled:cursor-not-allowed mt-4"
        >
          <span *ngIf="loading" class="loading-spinner w-5 h-5 mr-2"></span>
          {{ loading ? "Linking account..." : "Link Google Account" }}
        </button>
      </div>
    </form>

    <!-- Error Message -->
    <div
      *ngIf="error && !error.includes('Email already registered')"
      class="bg-red-50 border border-red-200 rounded-md p-4"
    >
      <div class="flex">
        <div class="ml-3">
          <h3 class="text-sm font-medium text-red-800">Sign in failed</h3>
          <div class="mt-2 text-sm text-red-700">
            {{ error }}
          </div>
        </div>
      </div>
    </div>

    <!-- User Info (after successful login) -->
    <div *ngIf="user" class="mt-6 text-center">
      <h2 class="text-xl font-bold">Welcome, {{ user.name }}</h2>
      <p class="text-sm text-gray-600">Email: {{ user.email }}</p>
      <img
        *ngIf="user.picture"
        [src]="user.picture"
        alt="Profile Picture"
        class="rounded-circle mx-auto mt-2"
        width="50"
      />
      <button
        class="btn-primary w-full flex justify-center py-3 px-4 rounded-md shadow-sm bg-red-600 text-white font-medium hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 mt-4"
      >
        Sign Out
      </button>
    </div>
  </div>
</div>
