<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-100 via-white to-purple-100 py-12 px-4 sm:px-6 lg:px-8"
>
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-2xl">
    <div>
      <h2 class="text-center text-3xl font-extrabold text-gray-900">
        Forgot Your Password?
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Enter your email address and we'll send you an OTP on your registered
        Email Address to reset your password.
      </p>
    </div>
    <form
      class="mt-8 space-y-6"
      [formGroup]="forgotPasswordForm"
      (ngSubmit)="onSubmit()"
    >
      <div class="rounded-md shadow-sm -space-y-px">
        <div>
          <label for="email-address" class="sr-only">Email address</label>
          <input
            id="email-address"
            name="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
            [ngClass]="{
              'border-red-500':
                forgotPasswordForm.get('email')?.invalid &&
                (forgotPasswordForm.get('email')?.touched ||
                  forgotPasswordForm.get('email')?.dirty)
            }"
            placeholder="Email address"
          />
          <div
            *ngIf="
              forgotPasswordForm.get('email')?.invalid &&
              (forgotPasswordForm.get('email')?.touched ||
                forgotPasswordForm.get('email')?.dirty)
            "
            class="text-red-500 text-sm mt-1"
          >
            <span *ngIf="forgotPasswordForm.get('email')?.errors?.['required']"
              >Email is required</span
            >
            <span *ngIf="forgotPasswordForm.get('email')?.errors?.['email']"
              >Invalid email format</span
            >
          </div>
        </div>
      </div>

      <div *ngIf="error" class="text-red-500 text-sm text-center">
        {{ error }}
      </div>
      <div *ngIf="success" class="text-green-500 text-sm text-center">
        {{ success }}
      </div>

      <div>
        <button
          type="submit"
          [disabled]="forgotPasswordForm.invalid || loading"
          class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span class="absolute left-0 inset-y-0 flex items-center pl-3">
            <svg
              *ngIf="!loading"
              class="h-5 w-5 text-blue-500 group-hover:text-blue-400"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 20 20"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                fill-rule="evenodd"
                d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                clip-rule="evenodd"
              />
            </svg>
            <svg
              *ngIf="loading"
              class="animate-spin h-5 w-5 text-blue-500"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
          </span>
          {{ loading ? "Sending..." : "Send Reset Link" }}
        </button>
      </div>
    </form>
    <div class="text-center">
      <a
        routerLink="/login"
        class="font-medium text-blue-600 hover:text-blue-500"
        >Back to Login</a
      >
    </div>
  </div>
</div>
