<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-500 to-purple-600 p-4"
>
  <div
    class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full transform transition-all duration-300 hover:scale-105"
  >
    <h2 class="text-2xl font-bold text-gray-800 mb-2 text-center">
      Verify OTP
    </h2>
    <p class="text-gray-600 mb-6 text-center">
      Enter the 6-digit OTP sent to <strong>{{ email || "your email" }}</strong
      >.
    </p>

    <form
      [formGroup]="otpForm"
      (ngSubmit)="onSubmit()"
      (paste)="onPaste($event)"
    >
      <div class="flex justify-between mb-6 gap-2">
        <input
          #otpInput
          type="text"
          formControlName="digit1"
          maxlength="1"
          (input)="onInput($event, 1)"
          (keydown)="onKeyDown($event, 0)"
          aria-label="OTP digit 1"
          class="w-12 h-12 text-center text-lg border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition-colors duration-200"
          [ngClass]="{
            'border-red-500 animate-shake':
              otpForm.get('digit1')?.invalid && otpForm.get('digit1')?.touched
          }"
        />
        <input
          #otpInput
          type="text"
          formControlName="digit2"
          maxlength="1"
          (input)="onInput($event, 2)"
          (keydown)="onKeyDown($event, 1)"
          aria-label="OTP digit 2"
          class="w-12 h-12 text-center text-lg border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition-colors duration-200"
          [ngClass]="{
            'border-red-500 animate-shake':
              otpForm.get('digit2')?.invalid && otpForm.get('digit2')?.touched
          }"
        />
        <input
          #otpInput
          type="text"
          formControlName="digit3"
          maxlength="1"
          (input)="onInput($event, 3)"
          (keydown)="onKeyDown($event, 2)"
          aria-label="OTP digit 3"
          class="w-12 h-12 text-center text-lg border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition-colors duration-200"
          [ngClass]="{
            'border-red-500 animate-shake':
              otpForm.get('digit3')?.invalid && otpForm.get('digit3')?.touched
          }"
        />
        <input
          #otpInput
          type="text"
          formControlName="digit4"
          maxlength="1"
          (input)="onInput($event, 4)"
          (keydown)="onKeyDown($event, 3)"
          aria-label="OTP digit 4"
          class="w-12 h-12 text-center text-lg border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition-colors duration-200"
          [ngClass]="{
            'border-red-500 animate-shake':
              otpForm.get('digit4')?.invalid && otpForm.get('digit4')?.touched
          }"
        />
        <input
          #otpInput
          type="text"
          formControlName="digit5"
          maxlength="1"
          (input)="onInput($event, 5)"
          (keydown)="onKeyDown($event, 4)"
          aria-label="OTP digit 5"
          class="w-12 h-12 text-center text-lg border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition-colors duration-200"
          [ngClass]="{
            'border-red-500 animate-shake':
              otpForm.get('digit5')?.invalid && otpForm.get('digit5')?.touched
          }"
        />
        <input
          #otpInput
          type="text"
          formControlName="digit6"
          maxlength="1"
          (input)="onInput($event, 6)"
          (keydown)="onKeyDown($event, 5)"
          aria-label="OTP digit 6"
          class="w-12 h-12 text-center text-lg border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition-colors duration-200"
          [ngClass]="{
            'border-red-500 animate-shake':
              otpForm.get('digit6')?.invalid && otpForm.get('digit6')?.touched
          }"
        />
      </div>
      <div
        *ngIf="otpForm.invalid && otpForm.touched"
        class="text-red-500 text-sm mb-4 text-center"
        role="alert"
      >
        Please enter a valid 6-digit OTP.
      </div>

      <div
        *ngIf="success"
        class="bg-green-100 text-green-700 p-3 rounded-lg mb-4 text-center"
        role="alert"
      >
        {{ success }}
      </div>
      <div
        *ngIf="error"
        class="bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-center"
        role="alert"
      >
        {{ error }}
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors duration-200 disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center justify-center"
        [disabled]="loading || otpForm.invalid"
        aria-label="Verify OTP"
      >
        {{ loading ? "Verifying..." : "Verify OTP" }}
        <svg *ngIf="loading" class="animate-spin ml-2 h-5 w-5 text-white">
          <!-- SVG for spinner -->
          <circle
            cx="10"
            cy="10"
            r="8"
            stroke="currentColor"
            stroke-width="2"
            fill="none"
            stroke-dasharray="50"
            stroke-dashoffset="10"
          />
        </svg>
      </button>
    </form>

    <div class="mt-4 text-center">
      <p class="text-gray-600">
        Didn't receive the OTP?
        <button
          class="text-blue-600 hover:underline font-medium"
          (click)="resendOtp()"
          [disabled]="resendLoading"
          aria-label="Resend OTP"
        >
          {{ resendLoading ? "Resending..." : "Resend OTP" }}
        </button>
      </p>
    </div>

    <p class="mt-4 text-center text-gray-600">
      Back to
      <a
        routerLink="/forgot-password"
        class="text-blue-600 hover:underline"
        aria-label="Back to forgot password"
        >Forgot Password</a
      >
    </p>
  </div>
</div>
